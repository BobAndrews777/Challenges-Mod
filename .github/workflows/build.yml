name: Mod bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Bauen
        run: gradle build --no-configuration-cache
      - name: Fertige Mod hochladen
        uses: actions/upload-artifact@v4
        with:
          name: challenges-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: Als Release veröffentlichen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Challenges-Mod (Build ${{ github.run_number }})
          body: Automatisch gebaut aus dem neuesten Stand. Diese .jar kommt auf den Server und zu allen Spielern (zusammen mit Fabric API).
          make_latest: true
          files: |
            build/libs/challenges-*.jar
